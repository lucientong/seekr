name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  quality:
    name: Retrieval quality (ONNX Hybrid)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache Seekr ONNX models
        uses: actions/cache@v4
        with:
          path: ~/.seekr/models
          key: seekr-onnx-minilm-${{ runner.os }}-v1
      - name: Run Hybrid quality gate
        env:
          SEEKR_QUALITY_GATE: "1"
          SEEKR_MODEL_DIR: ${{ github.workspace }}/.seekr-models
        run: |
          mkdir -p "$SEEKR_MODEL_DIR"
          # Prefer the shared cache path when populated.
          if [ -d "$HOME/.seekr/models" ] && [ "$(ls -A "$HOME/.seekr/models" 2>/dev/null)" ]; then
            export SEEKR_MODEL_DIR="$HOME/.seekr/models"
          fi
          cargo test --locked --test retrieval_quality_test onnx_hybrid_quality_gate_v1 -- --nocapture
      - name: Persist models into cache path
        if: always()
        run: |
          mkdir -p "$HOME/.seekr/models"
          if [ -d "${{ github.workspace }}/.seekr-models" ]; then
            cp -R "${{ github.workspace }}/.seekr-models/." "$HOME/.seekr/models/" || true
          fi
